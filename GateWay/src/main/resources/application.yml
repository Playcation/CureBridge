spring:

  application:
    name: gateway

  jwt:
    secret: ${JWT_KEY}

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_KEY}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/user/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    org.springframework.security: DEBUG