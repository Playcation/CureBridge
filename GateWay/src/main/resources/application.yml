spring:

  #  application:
  #    name: gateway

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  main:
    web-application-type: reactive

  config:
    import: classpath:application-common.properties

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/anonymous/user/**,/api/user/auth/**,
                  /api/user/user/**,/api/org-manager/user/**,
                  /api/org-admin/user/**,/api/org-manager/user/**, /api/org-manager/**, /api/organization/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/anonymous/notices/**,/api/user/notices/**,
                  /api/org-manager/notices/**,/api/org-admin/notices/**,/api/admin/notices/**,
                  /api/content/**, /api/content/calendar/**, /api/user/ocr/**
              filters:
                - StripPrefix=2
            - id: chat-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/user/chat/**,/api/org-manager/chat/**,/api/org-admin/chat/**,/api/admin/chat/**
              filters:
                - StripPrefix=2
            
            # Swagger Routes
            - id: member-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/member-service/v3/api-docs
              filters:
                - RewritePath=/member-service/(?<segment>.*), /$\{segment}

            - id: content-service-docs
              uri: http://localhost:8082
              predicates:
                - Path=/content-service/v3/api-docs
              filters:
                - RewritePath=/content-service/(?<segment>.*), /$\{segment}

            - id: chat-service-docs
              uri: http://localhost:8083
              predicates:
                - Path=/chat-service/v3/api-docs
              filters:
                - RewritePath=/chat-service/(?<segment>.*), /$\{segment}

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    display-query-params-with-url: true
    urls:
      - name: Member Service
        url: /member-service/v3/api-docs
      - name: Content Service
        url: /content-service/v3/api-docs
  api-docs:
    enabled: true
