spring:

  #  application:
  #    name: gateway

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  main:
    web-application-type: reactive

  config:
     import: classpath:application-common.properties

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/anonymous/user/**,/api/user/auth/**,
                  /api/user/user/**,/api/org-manager/user/**,
                  /api/org-admin/user/**,/api/org-manager/user/**, /api/org-manager/**, /api/organization/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/anonymous/content/**,/api/user/content/**,
                  /api/org-manager/content/**,/api/org-admin/content/**,/api/admin/content/**
              filters:
                - StripPrefix=2
            - id: chat-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/user/chat/**,/api/org-manager/chat/**,/api/org-admin/chat/**,/api/admin/chat/**
              filters:
                - StripPrefix=3
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    org.springframework.security: DEBUG