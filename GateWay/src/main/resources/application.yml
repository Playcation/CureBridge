spring:

  #  application:
  #    name: gateway

  #    jwt:
  #      secret: WEFWEGWGweffwetyqwfgwwgqegqafawegEFfewfweghsdfgaerg
  #    secret: ${JWT_KEY}

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: WEFWEGWGweffwetyqwfgwwgqegqafawegEFfewfweghsdfgaerg
  #          secret-key: ${JWT_KEY}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/anonymous/user/**,/api/user/auth/**,
                  /api/user/user/**,/api/org-manager/user/**,
                  /api/org-admin/user/**,/api/org-manager/user/**, /api/org-manager/**, /api/organization/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/anonymous/notices/**,/api/user/notices/**,
                  /api/org-manager/notices/**,/api/org-admin/notices/**,/api/admin/notices/**
              filters:
                - StripPrefix=2
            - id: chat-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/user/chat/**,/api/org-manager/chat/**,/api/org-admin/chat/**,/api/admin/chat/**
              filters:
                - StripPrefix=2
server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    org.springframework.security: DEBUG