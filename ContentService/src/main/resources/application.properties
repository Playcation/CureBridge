spring.application.name=ContentService

spring.config.import=classpath:common-application.properties

ocr.secretKey=${OCR_SECRETKEY}
ocr.apiUrl=${OCR_APIURL}

# JPA ??
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.data.mongodb.uri=mongodb://admin:0000@localhost:27018/curebridge-content-mongo?authSource=admin
# optional - MongoDB ?? ??
spring.data.mongodb.database=curebridge-db
# logging (??)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

openai.api-key=${OPENAI_API_KEY}
openai.ai-model=gpt-3.5-turbo

newsapi.clientId=${NEWSAPI_CLIENTID}
newsapi.clientSecret=${NEWSAPI_CLIENTSECRET}
server.port=8081
spring.elasticsearch.uris=http://localhost:9200