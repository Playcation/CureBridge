name: backend-script

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for PR compile check)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile CommonModule (PR & push)
        run: ./gradlew :CommonModule:compileJava --no-daemon --stacktrace --info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure DOCKERHUB_USERNAME is set (push only)
        if: github.event_name == 'push'
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "DOCKERHUB_USERNAME is empty" && exit 1)

      - name: Login to Docker Hub (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Gateway
      - name: Build (and Push on push event) GateWay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GateWay/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Content
      - name: Build (and Push on push event) ContentService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContentService/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-content:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-content:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chat
      - name: Build (and Push on push event) Chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Chat/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-chat:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Member
      - name: Build (and Push on push event) MemberService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MemberService/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-member:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-member:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AppService
      - name: Build (and Push on push event) AppService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AppService/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-swarm:
    if: github.event_name == 'push'
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Swarm Manager
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd ~/curebridge

            # env 파일 생성
            echo "${{ secrets.GATEWAY_ENV }}" > gateway.env
            echo "${{ secrets.CONTENT_ENV }}" > content.env
            echo "${{ secrets.MEMBER_ENV }}" > member.env
            echo "${{ secrets.CHAT_ENV }}" > chat.env

            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-gateway:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-content:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-chat:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-member:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/curebridge-app:latest

            # Swarm 배포
            docker stack deploy -c docker-stack.yml curebridge --with-registry-auth
