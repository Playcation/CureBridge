name: backend-script

on:
  push:
    branches:
      - feature-boardhbdeploy
  pull_request:
    branches:
      - feature-boardhbdeploy

permissions:
  contents: read

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Gateway
      - name: Build and Push GateWay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GateWay/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-gateway:latest
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Content
      - name: Build and Push ContentService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContentService/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chat
      - name: Build and Push Chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Chat/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-chat:latest
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Member
      - name: Build and Push MemberService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MemberService/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-member:latest
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-member:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AppService (추가!)
      - name: Build and Push AppService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AppService/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/curebridge-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-swarm:
    # PR에서는 배포 막고, develop에 push될 때만 배포
    if: github.event_name == 'push'
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Swarm Manager
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd ~/curebridge

            # env 파일 생성 (기존 유지)
            echo "${{ secrets.GATEWAY_ENV }}" > gateway.env
            echo "${{ secrets.CONTENT_ENV }}" > content.env
            echo "${{ secrets.MEMBER_ENV }}" > member.env
            echo "${{ secrets.CHAT_ENV }}" > chat.env

            # (권장) 최신 이미지 땡겨오기
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/curebridge-gateway:latest
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/curebridge-chat:latest
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/curebridge-member:latest
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/curebridge-app:latest

            # Swarm 배포
            docker stack deploy -c docker-stack.yml curebridge --with-registry-auth