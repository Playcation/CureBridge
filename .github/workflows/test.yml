name: ContentService test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: write-all

jobs:

  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ContentService image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest ./ContentService
          docker push ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest

  #  EC2 자동 배포
  deploy-contentservice-to-ec2:
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTENT_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |  #contentservice : 8082
            CONTAINER_ID=$(sudo docker ps -q --filter "publish=8082-8082")
            if [ ! -z "$CONTAINER_ID" ]; then
              sudo docker stop $CONTAINER_ID
              sudo docker rm $CONTAINER_ID
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ vars.DOCKERHUB_USERNAME }} --password-stdin

            sudo docker pull ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest
            sudo docker run -d --name contentservice \
              --network es-bridge \
              -p 8082:8082 \
              -e DB_URL=${{ secrets.CONTENT_DB_URL }} \
              -e DB_USERNAME=${{ secrets.CONTENT_DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.CONTENT_DB_PASSWORD }} \
              -e OCR_SECRETKEY=${{ secrets.OCR_SECRETKEY }} \
              -e OCR_APIURL=${{ secrets.OCR_APIURL }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e NEWSAPI_CLIENTID=${{ secrets.NEWSAPI_CLIENTID }} \
              -e NEWSAPI_CLIENTSECRET=${{ secrets.NEWSAPI_CLIENTSECRET }} \
              -e JWT_KEY=${{ secrets.JWT_KEY }} \
              -e S3_ACCESSKEY=${{ secrets.S3_ACCESSKEY }} \
              -e S3_SECRETKEY=${{ secrets.S3_SECRETKEY }} \
              -e S3_IMAGE_BUCKET=${{ secrets.S3_IMAGE_BUCKET }} \
              -e SPRING_ELASTICSEARCH_URIS=http://es:9200 \
              ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest
