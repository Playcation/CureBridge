name: backend test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest  # GitHub Actions 기본 환경

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 0000
          MYSQL_DATABASE: curebridge-content-mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run ContentService tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3305/curebridge-content-mysql
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 0000
        run: ./gradlew :ContentService:test -x integrationTest

