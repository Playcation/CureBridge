name: backend-sript
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:latest
        ports:
          - 6379:6379
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests with gradle
        run: |
          ./gradlew :ContentService:test --no-daemon \
            -Dspring.data.mongodb.uri=mongodb://localhost:27017/testdb \
            -Dspring.elasticsearch.uris=http://localhost:9200 \
            -Dspring.data.redis.host=localhost \
            -Dspring.data.redis.port=6379 \
            -Dspring.jwt.secret=VGhpc0lzQVZhbGlkQmFzZTY0S2V5Rm9yVGVzdGluZ1B1cnBvc2VzT25seTEyMzQ1Njc4OTA=
            
  #          SPRING_DATA_MONGODB_URI: ${{ secrets.MONGODB_URI }}
  #          SPRING_ELASTICSEARCH_URIS: ${{ secrets.ELASTICSEARCH_URI }}
  #          SPRING_DATA_REDIS_HOST: ${{ secrets.REDIS_HOST }}

  #          SPRING_DATA_REDIS_PORT: ${{ secirets.REDIS_PORT }}

  docker-build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push GateWay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GateWay/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/curebridge-gateway:latest

      - name: Build and Push ContentService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContentService/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/curebridge-content:latest

      - name: Build and Push Chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Chat/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/curebridge-chat:latest

      - name: Build and Push MemberService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MemberService/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/curebridge-member:latest

      - name: Build and Push CommonModule
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CommonModule/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/curebridge-common:latest


  deploy-to-swarm:
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Swarm Manager
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/curebridge

            echo "${{ secrets.GATEWAY_ENV }}" > gateway.env
            echo "${{ secrets.CONTENT_ENV }}" > content.env
            echo "${{ secrets.MEMBER_ENV }}" > member.env

            docker stack deploy -c docker-stack.yml curebridge