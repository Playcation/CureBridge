spring.application.name=MemberService
server.port=8081

spring.jwt.secret=${JWT_KEY}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.jws-algorithms=HS256

logging.level.org.springframework.security=DEBUG
logging.level.com.example.memberservice=TRACE

#db config
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379


