spring.application.name=MemberService
server.port=8081
spring.config.import=classpath:application-common.properties
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=HS384
logging.level.org.springframework.security=DEBUG
logging.level.com.example.memberservice=TRACE
#db config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#redis
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
